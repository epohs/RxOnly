<template id="template-message-item">
  <li class="message-unread">
    <article class="message-item">
      <a href="#" class="message-reply-bar" hidden>
        <span class="message-reply-bar-text"></span>
      </a>
      {# Shown by create_message_item() for a tapback whose parent is not in the
         archive, and in the reply bar's own place — a reaction arrived on top of
         something, so it belongs above the byline exactly as a quoted parent does.
         It sat below .message-text until now, which read as though the note were
         about the reaction rather than the thing being reacted to; mesh-console has
         always had it above (see MessageItem.compose in its widgets.py, which now
         also dresses it as the bar).

         Wears the bar's class for the bar's looks, plus a modifier for the ways it
         has to differ. **A <p> and not an <a>, with no data-reply-to-id**: there is
         no message in the archive to open, so there is nothing to link to and the
         click handler in views.js — which matches on that attribute — leaves it
         alone. The leading asterisk marks it as the odd one out at a glance, next
         to a real bar's "Reply to:" label.

         The two are mutually exclusive: the bar above populates only for a
         non-tapback, this note only for a tapback. That is what keeps the shared
         negative top margin from being applied twice. #}
      <p class="message-reply-bar message-reply-untracked" hidden>
        <span class="message-reply-bar-text">* Reacting to an earlier message</span>
      </p>
      <header class="message-header">
        <a href="#" class="message-from node-link" data-field="from-node" data-node-id=""></a>
        <a href="#" class="message-time-link">
          <time class="message-time" data-field="rx-time" datetime="1970-01-01T00:00:00Z">—</time>
        </a>
      </header>
      <p class="message-text" data-field="text"></p>
    </article>
  </li>
</template>
